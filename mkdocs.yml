site_name: systemspec-designsystem
site_description: A declarative, machine-readable specification for defining complete design systems as code
site_url: https://plexusone.github.io/systemspec-designsystem
repo_url: https://github.com/plexusone/systemspec-designsystem
repo_name: plexusone/systemspec-designsystem

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - MCP Server: mcp-server.md
  - Specification:
      - Overview: specification/index.md
      - Meta: specification/meta.md
      - Principles: specification/principles.md
      - Foundations: specification/foundations.md
      - Components: specification/components.md
      - Patterns: specification/patterns.md
      - Accessibility: specification/accessibility.md
      - Theming: specification/theming.md
  - Go SDK: sdk.md
  - Agentic Maturity: agentic-maturity.md
  - Workflow Analysis: pidl/AUTOMATION_ANALYSIS.md
  - Examples: examples.md
  - Reference:
      - NPM Package Spec: specs/ROADMAP.md
  - Case Studies:
      - PlexusOne: case-studies/plexusone.md
      - Component Theming: case-studies/component-theming.md
  - Releases:
      - v0.5.0: releases/v0.5.0.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.1: releases/v0.1.1.md
      - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/systemspec-designsystem
